[workspace]
members = [
    "common",
    "database",
    "messaging",
    "middleware",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit"] }
tower-layer = "0.3"
tower-service = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "1", features = ["tokio-comp"] }

# JWT
jsonwebtoken = "9"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Metrics
prometheus = "0.13"

# HTTP types
http = "1"

# Testing
tokio-test = "0.4"

# Workspace crates
platform-common = { path = "common" }
platform-database = { path = "database" }
platform-messaging = { path = "messaging" }
platform-middleware = { path = "middleware" }
