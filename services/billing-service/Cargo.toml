[package]
name = "billing-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace shared crates
platform-common = { path = "../../libs/rust/common" }
platform-database = { path = "../../libs/rust/database" }
platform-messaging = { path = "../../libs/rust/messaging" }
platform-middleware = { path = "../../libs/rust/middleware" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "1", features = ["tokio-comp"] }

# Stripe
async-stripe = { version = "0.39", default-features = false, features = ["runtime-tokio-hyper-rustls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging & tracing
tracing = "0.1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Metrics
prometheus = "0.13"

# HTTP
http = "1"

# Crypto (for webhook signature verification)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
