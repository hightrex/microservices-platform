[package]
name = "file-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace shared crates
platform-common = { path = "../../libs/rust/common" }
platform-database = { path = "../../libs/rust/database" }
platform-messaging = { path = "../../libs/rust/messaging" }
platform-middleware = { path = "../../libs/rust/middleware" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "1", features = ["tokio-comp"] }

# S3 (MinIO compatible)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-types = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Metrics
prometheus = "0.13"

# HTTP
http = "1"

# File hashing
sha2 = "0.10"
hex = "0.4"

# MIME type detection
mime_guess = "2"
