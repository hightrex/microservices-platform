# File Service Configuration

[server]
host = "0.0.0.0"
port = 8084
cors_origins = ["http://localhost:3000"]

[database]
host = "localhost"
port = 5432
user = "file_user"
password = "file_password"
database = "file_db"
ssl_mode = "disable"
max_connections = 10
min_connections = 2

[redis]
host = "localhost"
port = 6379
password = ""
db = 0

[s3]
endpoint = "http://localhost:9000"
region = "us-east-1"
access_key = "minioadmin"
secret_key = "minioadmin"
bucket_prefix = "platform"

[logger]
level = "info"
environment = "local"

[quota]
default_limit_bytes = 1073741824   # 1 GB default per tenant
max_file_size_bytes = 104857600    # 100 MB max per file

[upload]
allowed_content_types = [
    "image/jpeg", "image/png", "image/gif", "image/webp",
    "application/pdf",
    "text/plain", "text/csv",
    "application/json",
    "application/zip",
]
