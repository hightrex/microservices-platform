version: '3.8'

services:
  adminer:
    image: docker.io/adminer:4.8.1
    container_name: platform-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  redis-commander:
    image: docker.io/rediscommander/redis-commander:latest
    container_name: platform-redis-commander
    restart: unless-stopped
    ports:
      - "8091:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
