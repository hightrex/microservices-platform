version: '3.8'

# Phase 1 Core Stack: API Gateway + Auth Service + Organization Service
# The gateway is the only publicly exposed port; backend services are internal only.
#
# Usage:
#   podman compose -f deploy/podman/compose.core.yml up -d
#
# Prerequisites:
#   - Infrastructure must be running (compose.base.yml): postgres, redis
#   - Databases must be initialized (make init-db)

services:
  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Containerfile
    container_name: platform-auth-service
    restart: unless-stopped
    # No external port — only reachable via gateway and internal network
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=auth_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - JWT_SECRET=dev-secret-change-in-production-minimum-32-chars!
      - JWT_ISSUER=auth-service
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  organization-service:
    build:
      context: ../../
      dockerfile: services/organization-service/Containerfile
    container_name: platform-organization-service
    restart: unless-stopped
    # No external port — only reachable via gateway and internal network
    expose:
      - "8081"
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=org_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=1
      - JWT_SECRET=dev-secret-change-in-production-minimum-32-chars!
      - AUTH_SERVICE_BASE_URL=http://platform-auth-service:8080
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Containerfile
    container_name: platform-notification-service
    restart: unless-stopped
    # No external port — only reachable via gateway and internal network
    expose:
      - "8082"
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=8082
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=notification_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=2
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - SMTP_FROM_ADDRESS=noreply@example.com
      - SMTP_FROM_NAME=Microservices Platform
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  audit-service:
    build:
      context: ../../
      dockerfile: services/audit-service/Containerfile
    container_name: platform-audit-service
    restart: unless-stopped
    # No external port — only reachable via gateway and internal network
    expose:
      - "8085"
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=8085
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=audit_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=4
      - COMPLIANCE_HASHCHAININGENABLED=true
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  billing-service:
    build:
      context: ../../
      dockerfile: services/billing-service/Containerfile
    container_name: platform-billing-service
    restart: unless-stopped
    # No external port — only reachable via gateway and internal network
    expose:
      - "8083"
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8083
      - APP_DATABASE__HOST=platform-postgres
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__USER=postgres
      - APP_DATABASE__PASSWORD=postgres
      - APP_DATABASE__DATABASE=billing_db
      - APP_DATABASE__SSL_MODE=disable
      - APP_DATABASE__MAX_CONNECTIONS=10
      - APP_DATABASE__MIN_CONNECTIONS=2
      - APP_REDIS__HOST=platform-redis
      - APP_REDIS__PORT=6379
      - APP_REDIS__PASSWORD=devredispass
      - APP_REDIS__DB=3
      - APP_STRIPE__SECRET_KEY=sk_test_placeholder
      - APP_STRIPE__WEBHOOK_SECRET=whsec_placeholder
      - APP_STRIPE__PUBLISHABLE_KEY=pk_test_placeholder
      - APP_STRIPE__TEST_MODE=true
      - APP_LOGGER__LEVEL=debug
      - APP_LOGGER__ENVIRONMENT=dev
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  file-service:
    build:
      context: ../../
      dockerfile: services/file-service/Containerfile
    container_name: platform-file-service
    restart: unless-stopped
    # No external port — only reachable via gateway and internal network
    expose:
      - "8084"
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8084
      - APP_DATABASE__HOST=platform-postgres
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__USER=postgres
      - APP_DATABASE__PASSWORD=postgres
      - APP_DATABASE__DATABASE=file_db
      - APP_DATABASE__SSL_MODE=disable
      - APP_DATABASE__MAX_CONNECTIONS=10
      - APP_DATABASE__MIN_CONNECTIONS=2
      - APP_REDIS__HOST=platform-redis
      - APP_REDIS__PORT=6379
      - APP_REDIS__PASSWORD=devredispass
      - APP_REDIS__DB=5
      - APP_S3__ENDPOINT=http://platform-minio:9000
      - APP_S3__REGION=us-east-1
      - APP_S3__ACCESS_KEY=minioadmin
      - APP_S3__SECRET_KEY=minioadmin
      - APP_S3__BUCKET_PREFIX=platform
      - APP_LOGGER__LEVEL=debug
      - APP_LOGGER__ENVIRONMENT=dev
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Containerfile
    container_name: platform-api-gateway
    restart: unless-stopped
    # Gateway is the ONLY publicly exposed port
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - AUTH_BASE_URL=http://platform-auth-service:8080
      - ORG_BASE_URL=http://platform-organization-service:8081
      - NOTIFICATION_BASE_URL=http://platform-notification-service:8082
      - BILLING_BASE_URL=http://platform-billing-service:8083
      - FILE_BASE_URL=http://platform-file-service:8084
      - AUDIT_BASE_URL=http://platform-audit-service:8085
      - REDIS_URL=redis://platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=2
      - CORS_ORIGINS=http://localhost:3001,http://localhost:3000
      - JWT_SECRET=dev-secret-change-in-production-minimum-32-chars!
      - JWT_ISSUER=auth-service
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=50000
      - MODULE_CACHE_TTL_SECONDS=300
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  app-net:
    external: true
    name: podman_app-net
  data-net:
    external: true
    name: podman_data-net
