version: '3.8'

services:
  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Containerfile
    container_name: platform-auth-service
    restart: always 
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=auth_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - JWT_SECRET=dev-secret-change-in-production-minimum-32-chars!
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  organization-service:
    build:
      context: ../../
      dockerfile: services/organization-service/Containerfile
    container_name: platform-organization-service
    restart: always 
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SERVER_PORT=8081
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=org_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=1
      - JWT_SECRET=dev-secret-change-in-production-minimum-32-chars!
      - AUTH_SERVICE_BASE_URL=http://platform-auth-service:8080
    depends_on:
      - auth-service
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Containerfile
    container_name: platform-notification-service
    restart: always
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - SERVER_PORT=8082
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=notification_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=2
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - SMTP_FROM_ADDRESS=noreply@example.com
      - SMTP_FROM_NAME=Microservices Platform
    depends_on:
      - auth-service
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  audit-service:
    build:
      context: ../../
      dockerfile: services/audit-service/Containerfile
    container_name: platform-audit-service
    restart: always
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - SERVER_PORT=8085
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - DATABASE_HOST=platform-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=audit_db
      - DATABASE_SSL_MODE=disable
      - REDIS_ADDRESS=platform-redis:6379
      - REDIS_PASSWORD=devredispass
      - REDIS_DB=4
      - COMPLIANCE_HASHCHAININGENABLED=true
    depends_on:
      - auth-service
    networks:
      - app-net
      - data-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app-net:
    external: true
    name: podman_app-net
  data-net:
    external: true
    name: podman_data-net
