global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['platform-auth-service:8080']

  - job_name: 'organization-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['platform-organization-service:8081']

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['platform-notification-service:8082']

  - job_name: 'billing-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['platform-billing-service:8083']

  - job_name: 'file-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['platform-file-service:8084']

  - job_name: 'audit-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['platform-audit-service:8085']
