version: '3.8'

services:
  zaproxy:
    image: docker.io/zaproxy/zap-stable:2.16.1
    container_name: platform-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=false -config api.key=${ZAP_API_KEY:-zap-dev-api-key}
    ports:
      - "127.0.0.1:8095:8080"
    volumes:
      - zap_data:/zap/wrk/

    networks:
      - security-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0

  trivy:
    image: docker.io/aquasec/trivy:0.59.1
    container_name: platform-trivy
    entrypoint: ["trivy"]
    command: ["--help"]
    volumes:
      - trivy_cache:/root/.cache/
    networks:
      - security-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1g
    cpus: 1.0

  kali:
    image: kali-automated:latest
    build:
      context: ../../scripts/security
      dockerfile: docker/Dockerfile.kali-automated
    container_name: platform-kali
    tty: true
    stdin_open: true
    command: ["/pentest/automated-scan.sh"]
    networks:
      - security-net
      - app-net
    volumes:
      - ../../scripts/security/kali:/pentest:rw
      - ../../reports/pentest:/pentest/results:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW       # nmap, network scanning
      - NET_ADMIN      # network config for pentesting
    mem_limit: 1g
    cpus: 1.0

networks:
  security-net:
    driver: bridge
  app-net:
    external: true
    name: podman_app-net

volumes:
  zap_data:
  trivy_cache:
